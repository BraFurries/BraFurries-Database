name: Schema validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: schema-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-validation:
    name: Static checks and disposable Flyway smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependency
        run: python -m pip install --requirement validation/requirements.txt

      - name: Validate repository documents
        run: python validation/scripts/validate_repository.py

      - name: Validate ownership manifest
        run: python validation/scripts/validate_ownership.py

      - name: Validate migration policy and official history
        run: python validation/scripts/validate_migrations.py --allow-official

      - name: Test offline schema inventory reconciler (synthetic fixtures)
        run: python -m unittest discover -s validation/tests -p 'test_*.py' -v

      - name: Validate Docker Compose configuration
        run: >-
          docker compose
          --env-file validation/disposable-compose.env
          --project-name brafurries_flyway_phase2
          --file validation/compose.yaml
          config --quiet

      - name: Run disposable Flyway smoke test
        run: python validation/scripts/smoke_test.py

      - name: Enforce cleanup
        if: always()
        run: >-
          docker compose
          --env-file validation/disposable-compose.env
          --project-name brafurries_flyway_phase2
          --file validation/compose.yaml
          down --volumes --remove-orphans
