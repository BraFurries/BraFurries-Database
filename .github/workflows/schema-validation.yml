name: Schema validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: schema-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-validation:
    name: Static checks and disposable Flyway smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install validation dependency
        run: python -m pip install --requirement validation/requirements.txt

      - name: Validate repository documents
        run: python validation/scripts/validate_repository.py

      - name: Validate ownership manifest
        run: python validation/scripts/validate_ownership.py

      - name: Validate migration policy and official history
        run: python validation/scripts/validate_migrations.py --allow-official

      - name: Test offline schema inventory reconciler (synthetic fixtures)
        run: python -m unittest discover -s validation/tests -p 'test_*.py' -v

      - name: Validate Docker Compose configuration
        run: >-
          docker compose
          --env-file validation/disposable-compose.env
          --project-name brafurries_flyway_phase2
          --file validation/compose.yaml
          config --quiet

      - name: Verify full baseline and explicit adoption in disposable MariaDB
        run: python validation/scripts/baseline_smoke_test.py

      - name: Verify physical metadata fingerprint and synthetic drift
        run: python validation/scripts/physical_fingerprint_smoke_test.py

      - name: Verify synthetic tenant isolation and cross-guild relationships
        run: python validation/scripts/tenant_isolation_smoke_test.py

      - name: Verify recruitment foundation migration and isolation in disposable MariaDB
        run: python validation/scripts/recruitment_foundation_smoke_test.py

      - name: Verify BraFurries-exclusive commerce grants in disposable MariaDB
        run: python validation/scripts/commerce_access_smoke_test.py

      - name: Verify finance ACL migration preserves grants and audit in MariaDB
        run: python validation/scripts/platform_access_migration_smoke_test.py

      - name: Verify BraFurries private commercial catalog in disposable MariaDB
        run: python validation/scripts/commerce_catalog_smoke_test.py

      - name: Verify BraFurries finance ledger in disposable MariaDB
        run: python validation/scripts/commerce_finance_smoke_test.py

      - name: Verify append-only operational metadata revisions in disposable MariaDB
        run: python validation/scripts/commerce_metadata_revision_smoke_test.py

      - name: Verify staff-issued artist invitations and canonical account migration on disposable MariaDB
        run: python validation/scripts/commerce_artist_claim_smoke_test.py

      - name: Validate cash movements and card fees on disposable MariaDB
        run: python validation/scripts/commerce_cashflow_smoke_test.py
      - name: Verify Discord OAuth account recovery ticket storage
        run: python validation/scripts/discord_link_challenge_smoke_test.py

      - name: Verify partner primary link on disposable MariaDB
        run: python validation/scripts/partner_primary_link_smoke_test.py

      - name: Verify partner Discord publication schema and safe withdrawal
        run: python validation/scripts/partner_discord_smoke_test.py

      - name: Verify social account reconciliation schema on MariaDB
        run: python validation/scripts/social_account_reconciliation_smoke_test.py

      - name: Run disposable Flyway smoke test
        run: python validation/scripts/smoke_test.py

      - name: Enforce cleanup
        if: always()
        run: >-
          docker compose
          --env-file validation/disposable-compose.env
          --project-name brafurries_flyway_phase2
          --file validation/compose.yaml
          down --volumes --remove-orphans
