field_name_warnings:
  user_id:
    warning: May be INTERNAL_USER_ID or a direct Discord snowflake. Validate table-specific evidence.
  guild_id:
    warning: May be a Discord snowflake, an internal link ID, or another domain identifier.
  server_guild_id:
    warning: Commonly a Discord guild snowflake, but do not infer without table evidence.
  discord_user_id:
    warning: Stores a Discord snowflake, not user_discord.id.
  disc_user_id:
    warning: In user_temp_roles this stores user_discord.id, not a Discord snowflake.

